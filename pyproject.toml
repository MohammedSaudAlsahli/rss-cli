[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rss-cli"
version = "0.2.0"
description = "A beautiful terminal RSS feed reader powered by Textual"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mohammed Alsahli", email = "mohammed.saud.alsahli@gmail.com" }]
keywords = ["terminal", "rss", "feed", "tui", "textual"]
dependencies = [
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "textual>=8.2.4",
    "typer>=0.24.2",
]

[project.scripts]
rss = "rss_cli.cli:app"
rss-cli = "rss_cli.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
